allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://storage.googleapis.com/download.flutter.io"
        }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://jitpack.io' }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // These plugins assume AGP 9 built-in Kotlin, which is disabled until all
    // Flutter plugins in this project support it. JDK 24 下 Kotlin 默认取运行时
    // 版本(24)，与 AGP 的 Java toolchain(17) 或某些库的 1.8 冲突；显式对齐。
    def kotlinLibs = ["file_picker", "workmanager_android", "device_info_plus",
                      "mobile_scanner", "package_info_plus", "share_plus"]
    if (project.name in kotlinLibs) {
        project.pluginManager.withPlugin("com.android.library") {
            project.pluginManager.apply("org.jetbrains.kotlin.android")
            def target = (project.name == "workmanager_android") ? JavaVersion.VERSION_1_8 : JavaVersion.VERSION_17
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions.jvmTarget = target
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
