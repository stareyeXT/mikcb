name: Android Push APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    env:
      MIN_APK_BYTES: 5242880

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Read build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          VERSION_NAME=${APP_VERSION%%+*}
          BASE_BUILD_NUMBER=${APP_VERSION##*+}
          CI_BUILD_NUMBER=$((BASE_BUILD_NUMBER + GITHUB_RUN_NUMBER))
          SHORT_SHA=${GITHUB_SHA::7}
          echo "version_name=${VERSION_NAME}-master.${GITHUB_RUN_NUMBER}.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_number=${CI_BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Prepare signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Missing Android signing secrets."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: app/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build apk
          --release
          --flavor prod
          --target-platform android-arm64
          --build-name "${{ steps.meta.outputs.version_name }}"
          --build-number "${{ steps.meta.outputs.build_number }}"

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=build/app/outputs/flutter-apk/app-prod-release.apk
          if [[ ! -f "$APK_PATH" ]]; then
            echo "Release APK not found: $APK_PATH"
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_PATH")
          if [[ "$APK_SIZE" -lt "$MIN_APK_BYTES" ]]; then
            echo "Release APK is too small: $APK_SIZE bytes"
            exit 1
          fi
          mkdir -p dist
          cp "$APK_PATH" "dist/mikcb-${{ steps.meta.outputs.version_name }}-arm64-v8a.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk-${{ steps.meta.outputs.short_sha }}
          path: dist/mikcb-*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
